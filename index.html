<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <title>MyLifeLog Pro</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-orange: #ff9f43;
            --accent-blue: #54a0ff;
            --accent-green: #1dd1a1;
            --accent-red: #ee5253;
            --warning-yellow: #fff3cd;
            --danger-red: #f8d7da;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        
        /* 現在時刻表示 */
        #nowTime { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; background: var(--card-bg); padding: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* 設定エリア */
        .settings { background: #e2e8f0; padding: 10px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; }
        .settings input { padding: 5px; border-radius: 5px; border: 1px solid #ccc; }

        /* 操作ボタン */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button.action-btn { padding: 20px 10px; font-size: 15px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .btn-wake { background: var(--accent-orange); }
        .btn-sleep { background: var(--accent-blue); }
        .btn-start { background: var(--accent-green); }
        .btn-end { background: var(--accent-red); }

        /* 記録リスト */
        .date-group { text-align: left; margin-top: 20px; }
        .date-header { font-weight: bold; padding: 5px 10px; background: #cbd5e1; border-radius: 6px; margin-bottom: 5px; }
        .log-list { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .log-item { border-bottom: 1px solid #eee; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .log-item:last-child { border-bottom: none; }
        
        .type-label { font-weight: bold; width: 100px; }
        .time-label { flex-grow: 1; text-align: right; margin-right: 15px; font-family: monospace; }
        .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; }

        /* 警告色 */
        .warning-yellow { background-color: #fffae6 !important; color: #856404; font-weight: bold; }
        .danger-red { background-color: #fee2e2 !important; color: #b91c1c; font-weight: bold; }
    </style>
</head>
<body>

    <div id="nowTime">読み込み中...</div>

    <div class="settings">
        目標就寝時間: <input type="time" id="targetTime" value="00:30" onchange="saveTarget()">
    </div>

    <div class="grid">
        <button class="action-btn btn-wake" onclick="addLog('起床')">☀️ 起床</button>
        <button class="action-btn btn-sleep" onclick="addLog('就寝')">🌙 就寝</button>
        <button class="action-btn btn-start" onclick="addLog('自由時間開始')">🏃 自由開始</button>
        <button class="action-btn btn-end" onclick="addLog('自由時間終了')">🛑 自由終了</button>
    </div>

    <div id="logContainer"></div>

    <script>
        // 目標時間の保存と読み込み
        function saveTarget() {
            localStorage.setItem('targetSleepTime', document.getElementById('targetTime').value);
            displayLogs(); // 色の反映のため再描画
        }
        function loadTarget() {
            const saved = localStorage.getItem('targetSleepTime');
            if(saved) document.getElementById('targetTime').value = saved;
        }

        // 常に現在時刻を表示
        function updateClock() {
            const now = new Date();
            const days = ['日','月','火','水','木','金','土'];
            const timeStr = `${now.getMonth()+1}月${now.getDate()}日(${days[now.getDay()]}) ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
            document.getElementById('nowTime').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 記録の追加
        function addLog(type) {
            const now = new Date();
            const log = {
                type: type,
                rawTimestamp: now.getTime(), // 比較用の生の時刻
                id: Date.now()
            };
            
            let logs = JSON.parse(localStorage.getItem('myLogsV2') || '[]');
            logs.unshift(log);
            localStorage.setItem('myLogsV2', JSON.stringify(logs));
            displayLogs();
        }

        function deleteLog(id) {
            if (!confirm('削除しますか？')) return;
            let logs = JSON.parse(localStorage.getItem('myLogsV2') || '[]');
            logs = logs.filter(l => l.id !== id);
            localStorage.setItem('myLogsV2', JSON.stringify(logs));
            displayLogs();
        }

        // 時刻の論理変換（5:59ルール）
        function getLogicalInfo(timestamp) {
            const date = new Date(timestamp);
            let h = date.getHours();
            let m = date.getMinutes();
            let displayDate = new Date(timestamp);

            // 0:00 〜 5:59 の場合
            if (h < 6) {
                h += 24;
                displayDate.setDate(displayDate.getDate() - 1);
            }

            const dateStr = `${displayDate.getMonth()+1}月${displayDate.getDate()}日`;
            const timeStr = `${h}:${m.toString().padStart(2, '0')}`;
            const totalMinutes = h * 60 + m; // 比較用の通算分

            return { dateStr, timeStr, totalMinutes };
        }

        function displayLogs() {
            const logs = JSON.parse(localStorage.getItem('myLogsV2') || '[]');
            const container = document.getElementById('logContainer');
            container.innerHTML = '';

            const targetTimeStr = document.getElementById('targetTime').value; // "00:30"
            const [targetH, targetM] = targetTimeStr.split(':').map(Number);
            let logicalTargetMins = targetH * 60 + targetM;
            if (targetH < 6) logicalTargetMins += 24 * 60; // 目標も5:59ルールで変換

            // 日付ごとにグループ化
            const groups = {};
            logs.forEach(log => {
                const info = getLogicalInfo(log.rawTimestamp);
                if (!groups[info.dateStr]) groups[info.dateStr] = [];
                groups[info.dateStr].push({ ...log, ...info });
            });

            if (Object.keys(groups).length === 0) {
                container.innerHTML = '<p style="color:#999;">記録がありません</p>';
                return;
            }

            for (const date in groups) {
                let html = `<div class="date-group"><div class="date-header">${date}</div><div class="log-list">`;
                groups[date].forEach(l => {
                    let alertClass = '';
                    if (l.type === '就寝') {
                        const diff = l.totalMinutes - logicalTargetMins;
                        if (diff >= 45) alertClass = 'danger-red';
                        else if (diff >= 15) alertClass = 'warning-yellow';
                    }

                    html += `
                        <div class="log-item ${alertClass}">
                            <span class="type-label">${l.type}</span>
                            <span class="time-label">${l.timeStr}</span>
                            <button class="del-btn" onclick="deleteLog(${l.id})">消去</button>
                        </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
        }

        loadTarget();
        displayLogs();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <title>MyLifeLog Pro V16</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --accent-orange: #ff9f43;
            --accent-blue: #54a0ff;
            --accent-green: #1dd1a1;
            --accent-red: #ee5253;
            --accent-purple: #a29bfe;
            --accent-work: #64748b;
            --log-blue: #dbeafe;
            --log-green: #dcfce7;
            --log-gray: #f1f5f9;
            --log-yellow: #fffbeb;
            --log-red: #fef2f2;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        #nowTime { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; background: var(--card-bg); padding: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .settings { background: #e2e8f0; padding: 10px; border-radius: 12px; margin-bottom: 15px; font-size: 13px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button.action-btn { padding: 15px 5px; font-size: 14px; border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        .btn-wake { background: var(--accent-orange); }
        .btn-sleep { background: var(--accent-blue); }
        .btn-work-start, .btn-work-end { background: var(--accent-work); }
        .btn-start { background: var(--accent-green); }
        .btn-end { background: var(--accent-red); }
        
        .memo-area { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .input-row { display: flex; gap: 8px; }
        #memoInput { flex-grow: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        #todoTimeInput { width: 70px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; }
        .memo-btns { display: flex; gap: 8px; }
        .btn-memo { flex: 1; background: var(--accent-purple); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; }
        .btn-todo { flex: 1; background: #636e72; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; }

        .date-group { text-align: left; margin-top: 25px; }
        .date-header { font-weight: bold; padding: 10px 12px; background: #cbd5e1; border-radius: 12px 12px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .free-total { font-size: 12px; color: #475569; background: #f1f5f9; padding: 2px 8px; border-radius: 4px; }
        
        .section-label { font-size: 12px; font-weight: bold; color: #64748b; padding: 8px 12px 4px; background: #f8fafc; border-left: 1px solid #eee; border-right: 1px solid #eee; }
        .todo-list, .log-list { background: var(--card-bg); border-left: 1px solid #eee; border-right: 1px solid #eee; overflow: hidden; }
        .log-list { border-radius: 0 0 12px 12px; border-bottom: 1px solid #eee; margin-bottom: 10px; }
        .log-item { border-bottom: 1px solid #eee; padding: 10px; display: flex; align-items: center; gap: 4px; }
        
        .todo-check { width: 22px; height: 22px; cursor: pointer; flex-shrink: 0; }
        .todo-text { font-size: 14px; font-weight: bold; flex-grow: 1; padding: 0 8px; }
        .todo-text.completed { text-decoration: line-through; color: #94a3b8; font-weight: normal; }
        .todo-est-inline { width: 50px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; padding: 4px 2px; text-align: center; font-family: monospace; background: #f8fafc; }

        .type-label { font-weight: bold; font-size: 13px; flex-grow: 1; text-align: left; }
        .time-label { font-family: monospace; font-size: 12px; color: #2563eb; font-weight: bold; width: 75px; text-align: right; }
        .icon-btn-wrap { position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; border-radius: 6px; border: none; font-size: 16px; flex-shrink: 0; }
        .icon-btn-wrap input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .del-btn { color: #ee5253; font-weight: bold; font-size: 18px; }

        .bg-blue { background-color: var(--log-blue) !important; }
        .bg-green { background-color: var(--log-green) !important; }
        .bg-gray { background-color: var(--log-gray) !important; }
        .bg-yellow { background-color: var(--log-yellow) !important; }
        .bg-red { background-color: var(--log-red) !important; color: #b91c1c; }
    </style>
</head>
<body>
    <div id="nowTime">...</div>
    <div class="settings">目標就寝: <input type="time" id="targetTime" value="00:30" onchange="saveTarget()"></div>
    <div class="grid">
        <button class="action-btn btn-wake" onclick="addLog('起床')">☀️ 起床</button>
        <button class="action-btn btn-sleep" onclick="addLog('就寝')">🌙 就寝</button>
        <button class="action-btn btn-work-start" onclick="addLog('労働開始')">💼 労働開始</button>
        <button class="action-btn btn-work-end" onclick="addLog('労働終了')">💼 労働終了</button>
        <button class="action-btn btn-start" onclick="addLog('自由時間開始')">🏃 自由時間開始</button>
        <button class="action-btn btn-end" onclick="addLog('自由時間終了')">🛑 自由時間終了</button>
    </div>
    <div class="memo-area">
        <div class="input-row">
            <input type="text" id="memoInput" placeholder="タスク・内容を入力...">
            <input type="number" id="todoTimeInput" placeholder="分" min="0">
        </div>
        <div class="memo-btns">
            <button class="btn-memo" onclick="addMemo(false)">記録</button>
            <button class="btn-todo" onclick="addMemo(true)">ToDo</button>
        </div>
    </div>
    <div id="logContainer"></div>

    <script>
        function formatAMPM(date) {
            let h = date.getHours(); let m = date.getMinutes();
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${ampm} ${h}:${m.toString().padStart(2, '0')}`;
        }
        function saveTarget() { localStorage.setItem('targetSleepTime', document.getElementById('targetTime').value); displayLogs(); }
        function loadTarget() { const saved = localStorage.getItem('targetSleepTime'); if(saved) document.getElementById('targetTime').value = saved; }
        
        function updateClock() {
            const now = new Date();
            const days = ['日','月','火','水','木','金','土'];
            const target = document.getElementById('nowTime');
            if(target) target.innerText = `${now.getMonth()+1}/${now.getDate()}(${days[now.getDay()]}) ${formatAMPM(now)}`;
        }
        setInterval(updateClock, 1000); updateClock();

        function addLog(type) { saveLog({ type, rawTimestamp: Date.now(), id: Date.now(), hideTime: false, isTodo: false, completed: false, est: "" }); }
        function addMemo(isTodo) {
            const input = document.getElementById('memoInput');
            const timeInput = document.getElementById('todoTimeInput');
            if (!input.value.trim()) return;
            saveLog({ 
                type: input.value, 
                rawTimestamp: Date.now(), 
                id: Date.now(), 
                hideTime: isTodo, 
                isTodo: isTodo, 
                completed: false,
                est: timeInput.value 
            });
            input.value = '';
            timeInput.value = '';
        }
        function saveLog(log) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            logs.push(log);
            localStorage.setItem('myLogsSimple', JSON.stringify(logs));
            displayLogs();
        }
        function deleteLog(id) { if (confirm('削除しますか？')) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            localStorage.setItem('myLogsSimple', JSON.stringify(logs.filter(l => l.id !== id)));
            displayLogs();
        }}
        function updateRawNoConfirm(id, newDateObj) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            const idx = logs.findIndex(l => l.id === id);
            if (idx !== -1) {
                logs[idx].rawTimestamp = newDateObj.getTime();
                logs[idx].hideTime = false;
                localStorage.setItem('myLogsSimple', JSON.stringify(logs));
                displayLogs();
            }
        }
        function editTodoText(id) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            const idx = logs.findIndex(l => l.id === id);
            if (idx !== -1) {
                const newText = prompt("ToDoを編集:", logs[idx].type);
                if (newText !== null && newText.trim() !== "") {
                    logs[idx].type = newText;
                    localStorage.setItem('myLogsSimple', JSON.stringify(logs));
                    displayLogs();
                }
            }
        }
        function updateTodoEst(id, newEst) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            const idx = logs.findIndex(l => l.id === id);
            if (idx !== -1) {
                logs[idx].est = newEst;
                localStorage.setItem('myLogsSimple', JSON.stringify(logs));
            }
        }
        function toggleTodo(id) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            const idx = logs.findIndex(l => l.id === id);
            if (idx !== -1) {
                logs[idx].completed = !logs[idx].completed;
                localStorage.setItem('myLogsSimple', JSON.stringify(logs));
                displayLogs();
            }
        }
        function toggleHide(id) {
            let logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            const idx = logs.findIndex(l => l.id === id);
            if (idx !== -1) {
                logs[idx].hideTime = !logs[idx].hideTime;
                localStorage.setItem('myLogsSimple', JSON.stringify(logs));
                displayLogs();
            }
        }

        function displayLogs() {
            const container = document.getElementById('logContainer');
            if (!container) return;
            const logs = JSON.parse(localStorage.getItem('myLogsSimple') || '[]');
            container.innerHTML = '';
            
            const targetVal = document.getElementById('targetTime').value;
            const [tH, tM] = targetVal.split(':').map(Number);
            const today = new Date();
            const todayKey = `${today.getMonth()+1}月${today.getDate()}日`;
            
            const groups = {};
            logs.forEach(log => {
                const d = new Date(log.rawTimestamp);
                let dateKey = `${d.getMonth()+1}月${d.getDate()}日`;
                // 未完了ToDoのみ今日のグループへ
                if (log.isTodo && !log.completed) dateKey = todayKey;
                
                if (!groups[dateKey]) groups[dateKey] = [];
                groups[dateKey].push({ ...log, dateObj: d });
            });

            const sortedKeys = Object.keys(groups).sort((a, b) => {
                const timeA = groups[a][0].rawTimestamp;
                const timeB = groups[b][0].rawTimestamp;
                return timeB - timeA;
            });

            sortedKeys.forEach(date => {
                const dayItems = groups[date].sort((a, b) => a.rawTimestamp - b.rawTimestamp);
                const todos = dayItems.filter(i => i.isTodo);
                const tlogs = dayItems.filter(i => !i.isTodo);
                
                let freeMins = 0; let startTime = null;
                tlogs.forEach(l => {
                    if (l.type === '自由時間開始') startTime = l.rawTimestamp;
                    else if (l.type === '自由時間終了' && startTime) { 
                        freeMins += (l.rawTimestamp - startTime) / 60000; startTime = null; 
                    }
                });

                let html = `<div class="date-group"><div class="date-header"><span>${date}</span><span class="free-total">自由: ${Math.floor(freeMins/60)}h ${Math.floor(freeMins%60)}m</span></div>`;
                
                if(todos.length > 0) {
                    html += `<div class="section-label">📌 ToDo</div><div class="todo-list">`;
                    todos.forEach(l => {
                        html += `<div class="log-item">
                            <input type="checkbox" class="todo-check" ${l.completed ? 'checked' : ''} onclick="toggleTodo(${l.id})">
                            <span class="todo-text ${l.completed ? 'completed' : ''}">${l.type}</span>
                            <input type="number" class="todo-est-inline" value="${l.est || ''}" placeholder="分" onchange="updateTodoEst(${l.id}, this.value)">
                            <button class="icon-btn-wrap" onclick="editTodoText(${l.id})">📝</button>
                            <button class="icon-btn-wrap del-btn" onclick="deleteLog(${l.id})">×</button>
                        </div>`;
                    });
                    html += `</div>`;
                }

                html += `<div class="section-label">🕒 タイムログ</div><div class="log-list">`;
                tlogs.forEach(l => {
                    const time24 = `${l.dateObj.getHours().toString().padStart(2,'0')}:${l.dateObj.getMinutes().toString().padStart(2,'0')}`;
                    const dateISO = `${l.dateObj.getFullYear()}-${(l.dateObj.getMonth()+1).toString().padStart(2,'0')}-${l.dateObj.getDate().toString().padStart(2,'0')}`;
                    let bgClass = '';
                    if (l.type === '就寝') {
                        let diff = (l.dateObj.getHours()*60+l.dateObj.getMinutes() - (tH*60+tM) + 1440) % 1440;
                        if (diff > 720) diff -= 1440;
                        if (diff <= 15) bgClass = 'bg-blue';
                        else if (diff < 45) bgClass = 'bg-yellow';
                        else bgClass = 'bg-red';
                    } else if (l.type.includes('自由時間')) bgClass = 'bg-green';
                    else if (l.type.includes('労働')) bgClass = 'bg-gray';
                    
                    html += `<div class="log-item ${bgClass}">
                        <span class="type-label">${l.type}</span>
                        <span class="time-label">${l.hideTime ? '' : formatAMPM(l.dateObj)}</span>
                        <div class="icon-btn-wrap">⌚<input type="time" value="${time24}" onchange="const d=new Date(${l.rawTimestamp}); const [h,m]=this.value.split(':'); d.setHours(h,m); updateRawNoConfirm(${l.id}, d)"></div>
                        <div class="icon-btn-wrap">📅<input type="date" value="${dateISO}" onchange="const d=new Date(${l.rawTimestamp}); const [y,m,day]=this.value.split('-'); d.setFullYear(y,m-1,day); updateRawNoConfirm(${l.id}, d)"></div>
                        <button class="icon-btn-wrap" onclick="toggleHide(${l.id})">⌛</button>
                        <button class="icon-btn-wrap del-btn" onclick="deleteLog(${l.id})">×</button>
                    </div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }
        loadTarget(); displayLogs();
    </script>
</body>
</html>
